name: Deploy dashboard to Cloudflare

# The backend has deployed itself on push since the EC2 key became a repo secret.
# The dashboard never did, so every release needed somebody with the Cloudflare
# login to run `wrangler deploy` by hand — which meant the frontend routinely sat
# a few commits behind the API it talks to. On 2026-08-11 that gap shipped a
# dashboard calling endpoints its backend did not have.
#
# Requires one secret: CLOUDFLARE_API_TOKEN, with the "Edit Cloudflare Workers"
# template on the account that owns the monocle-dashboard worker. Add
# CLOUDFLARE_ACCOUNT_ID too if that token can see more than one account —
# wrangler cannot pick for you and fails asking which.
#
# Worker secrets (MONOCLE_API_KEY) are NOT touched here. They live on the worker,
# not in the deploy bundle, and survive every deploy. Do not add a step that sets
# them: that would put the platform API key in CI, which is the arrangement the
# proxy exists to avoid.

on:
  push:
    branches: [main]
    paths:
      - "agent-dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

# One deploy at a time. Two overlapping uploads of the same worker race to be
# last-write-wins, and the loser is whichever finished first — not necessarily
# the older commit.
concurrency:
  group: deploy-dashboard
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-dashboard

    steps:
      - uses: actions/checkout@v4

      # Fail here, with a sentence a human can act on, rather than 4 minutes
      # later inside wrangler with "not authenticated".
      - name: Check for Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings > Secrets and variables > Actions, using the 'Edit Cloudflare Workers' token template."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          # Next 16 needs 20.9+; 22 is the current LTS.
          node-version: 22
          cache: npm
          cache-dependency-path: agent-dashboard/package-lock.json

      - name: Install
        run: npm ci

      # `npm run deploy` is `opennextjs-cloudflare build && opennextjs-cloudflare
      # deploy`. The build also runs scripts/check-public-env.js via next.config.js,
      # which refuses to build if a NEXT_PUBLIC_ variable is named something that
      # would inline a secret into the client bundle.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # A green deploy step means the upload was accepted, not that the site
      # serves. Check the thing users actually hit.
      #
      # The custom domain is attached to the worker in the Cloudflare dashboard
      # rather than declared in wrangler.jsonc, so it survives a deploy — this
      # step is what would catch it if that ever stopped being true.
      - name: Verify the site is serving
        run: |
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://monocle.3lvn4g.xyz/ || echo 000)
            if [ "$code" = "200" ]; then
              echo "Dashboard is serving (HTTP $code)."
              exit 0
            fi
            echo "Attempt $attempt: HTTP $code — waiting for propagation."
            sleep 10
          done
          echo "::error::Deploy uploaded but https://monocle.3lvn4g.xyz/ did not return 200 (last: $code). Check the worker's routes in the Cloudflare dashboard."
          exit 1
