name: Deploy backend to EC2

on:
  push:
    branches: [main]
    paths:
      - "agent-backend/**"
      - "deploy/backend.env"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: 54.242.122.233
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            REMOTE="/opt/monocle/app"

            # Pull latest code
            cd $REMOTE
            git fetch origin main
            git reset --hard origin/main

            # Build backend
            cd $REMOTE/agent-backend
            npm ci
            npm run build

            # Run DB migrations (safe — only applies new ones, never drops data)
            cd $REMOTE/agent-backend
            # Load backend.env by sourcing it rather than `export $(... | xargs)`.
            # xargs splits on whitespace, so any value containing a space broke the
            # deploy: `EMAIL_FROM=Monocle <noreply@x>` became
            # `export EMAIL_FROM=Monocle <noreply@x>`, where `<` is a redirect —
            # bash errors with "not a valid identifier" and `set -e` aborts the run.
            # Quoting the value didn't help either, because xargs strips the quotes.
            # `set -a` exports everything the file defines; quoted values survive.
            set -a
            . $REMOTE/deploy/backend.env
            set +a
            # db:migrate:deploy baselines the pre-Drizzle schema first. The prod DB
            # was built from schema.sql before Drizzle existed, so its tables are
            # already present but 0000 isn't recorded — plain `drizzle-kit migrate`
            # then tries to re-CREATE existing tables and aborts the deploy (which is
            # why it has failed at this step every time). See
            # scripts/ensure-drizzle-baseline.js. Idempotent and non-destructive.
            npm run db:migrate:deploy

            # Restart service
            sudo systemctl restart monocle-backend
            sleep 3
            sudo systemctl is-active monocle-backend
